name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docs structure
        run: |
          echo "Validating documentation structure..."
          test -f docs/README.md
          test -f docs/charter.md
          test -f docs/architecture.md
          test -f docs/glossary.md
          test -d docs/decisions
          test -d docs/specs
          echo "Documentation structure valid."

  # TODO: Add these jobs back when code is implemented
  # - unit-tests: Run unit tests
  # - docker-build-push: Build and push Docker image
  # - security-scan: Security scanning
  # - sonar-scan: Code quality scanning
  # - helm-publish: Publish Helm charts
  # - trigger-cd: Trigger deployment
