services:
  # Database - AgensGraph + PgVector + Postgres
  # Port Mapping: 5456:5432
  ioc-scale-db:
    image: ghcr.io/outshift-open/ioc-knowledge-memory-svc-db:0.2.1
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    container_name: ioc-scale-db
    environment:
      POSTGRES_DB: ${IOC_KNOWLEDGE_DB:-ioc-knowledge-db}
      POSTGRES_USER: ${IOC_KNOWLEDGE_DB_USER}
      POSTGRES_PASSWORD: ${IOC_KNOWLEDGE_DB_PASSWORD}
    ports:
      - "${IOC_KNOWLEDGE_DB_PORT:-5456}:5432"
    volumes:
      - ioc_scale_db_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    restart: unless-stopped
    healthcheck:
      test: [
          "CMD-SHELL",
          "pg_isready -h localhost -p 5432 -U ${IOC_KNOWLEDGE_DB_USER} -d
          ${IOC_KNOWLEDGE_DB:-ioc-knowledge-db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Mgmt Backend Service - FastAPI backend for workspaces, users, CFN nodes
  # Port Mapping: 9000:9000
  ioc-scale-cf-mgmt-svc:
    # Image Link: https://github.com/cisco-eti/ioc-scale-cf-mgmt-svc/pkgs/container/ioc-scale-cf-mgmt-svc
    image: ghcr.io/cisco-eti/ioc-scale-cf-mgmt-svc:2026-08-13-f457a4c
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    container_name: ioc-scale-cf-mgmt-svc
    ports:
      - "9000:9000"
    environment:
      - SERVICE_NAME=ioc-scale-cf-mgmt-svc
      - APPLICATION_VERSION=dev
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ADMIN_USER_PASSWORD=${ADMIN_USER_PASSWORD}
      - POSTGRES_HOST=ioc-scale-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cfn_mgmt
      - POSTGRES_USER=${IOC_KNOWLEDGE_DB_USER}
      - POSTGRES_PASSWORD=${IOC_KNOWLEDGE_DB_PASSWORD}
      - PORT=9000
      - CFN_DEV_MODE=${CFN_DEV_MODE}
      - CFN_SVC_URL=${CFN_SVC_URL:-http://ioc-cfn-svc:9002}
    volumes:
      - ./.secrets:/home/app/.secrets:ro
    restart: unless-stopped
    depends_on:
      ioc-scale-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://ioc-scale-cf-mgmt-svc:9000/api/internal/diagnostics/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Mgmt. Plane UI - Next.js frontend for management plane
  # Port Mapping: 9001:9001
  ioc-cfn-mgmt-plane-ui:
    # Image Link: https://github.com/cisco-eti/ioc-scale-cf-ui/pkgs/container/ioc-scale-cf-ui
    image: ghcr.io/cisco-eti/ioc-scale-cf-ui:2026-08-14-52542ed
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    container_name: ioc-cfn-mgmt-plane-ui
    ports:
      - "9001:9001"
    environment:
      - NODE_ENV=production
      - PORT=9001
      - CFN_UI_API_BASE_URL=http://ioc-scale-cf-mgmt-svc:9000
      - NEXT_PUBLIC_CFN_UI_API_BASE_URL=http://localhost:9000
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:9001}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    restart: unless-stopped
    depends_on:
      ioc-scale-cf-mgmt-svc:
        condition: service_healthy

  # CFN Service - Cognition Fabric Node
  # Port Mapping: 9002:9002 (HTTP)
  ioc-scale-cfn-svc:
    # Image Link: https://github.com/cisco-eti/ioc-scale-cfn-svc/pkgs/container/ioc-scale-cfn-svc
    image: ghcr.io/cisco-eti/ioc-scale-cfn-svc:2026-08-14-9d46995
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    container_name: ioc-cfn-svc
    restart: unless-stopped
    ports:
      - "9002:9002"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MGMT_URL=${MGMT_URL:-http://ioc-scale-cf-mgmt-svc:9000}
      - CFN_NAME=${CFN_NAME:-cfn-new}
      - CFN_IP=${CFN_IP:-"Not Set"}
      - HEARTBEAT_INTERVAL_SECONDS=${HEARTBEAT_INTERVAL_SECONDS:-10}
      - SERVICE_NAME=${SERVICE_NAME:-ioc-cfn-svc}
      - DB_NAME=${DB_NAME:-cfn_cp}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=ioc-scale-db
      - DB_PORT=5432
    depends_on:
      ioc-scale-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:9002/api/internal/diagnostics/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Cognition Engines
  # Port Mapping: 9004:9004
  ioc-scale-cf-cognition-engine:
    # Image Link: https://github.com/cisco-eti/ioc-scale-cf-cognition-engines/pkgs/container/ioc-scale-cf-cognition-engines%2Fce-demo
    image: ghcr.io/cisco-eti/ioc-scale-cf-cognition-engines/ce-demo:2026-08-14-46f5462
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    container_name: ioc-cfn-cognition-engines
    ports:
      - "9004:9004"
    restart: unless-stopped
    environment:
      - CFN_URL=http://ioc-cfn-svc:9002
      - COGNITION_ENGINE_HOST=ioc-cfn-cognition-engines
      - COGNITION_ENGINE_PORT=9004
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      ioc-scale-cfn-svc:
        condition: service_healthy

volumes:
  ioc_scale_db_data:
