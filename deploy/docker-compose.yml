# ---------------------------------------------------------------------------
# OXP (Observability & Explainability Platform) worker environment
# Workers run from prebuilt claris-lib images (GHCR) and are amd64-only.
# ---------------------------------------------------------------------------
# Workers assemble the AMQP URL from these parts, so no connection string with
# embedded credentials is needed here.
x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest} # legit:ignore

x-worker-env: &worker-env
  <<: *rabbitmq-env
  HOME: /claris
  MPLCONFIGDIR: /claris/.config/matplotlib
  API_BASE_URL: http://host.docker.internal:8081
  NEO4J_HOST: neo4j:7687
  NEO4J_URI: bolt://neo4j:7687
  UV_LINK_MODE: copy
  UV_PROJECT_ENVIRONMENT: /opt/venv
  PYTHONUNBUFFERED: 1
  MLFLOW_TRACKING_URI: http://${MLFLOW_HOST}:${MLFLOW_PORT}
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse-server}
  CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
  CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin} # legit:ignore

x-worker-base: &worker-base
  platform: ${CLARIS_WORKER_PLATFORM:-linux/amd64}
  env_file:
    - path: .env
      required: false
  depends_on:
    rabbitmq:
      condition: service_healthy
    neo4j:
      condition: service_healthy
    clickhouse-server:
      condition: service_healthy
  volumes:
    - type: bind
      source: ${MCE_CONFIG_FILE:-./mce_config.yaml}
      target: /claris/mce_config.yaml
    - /dev/null:/app/workflows/.env
  environment: *worker-env

services:
  # Database - AgensGraph + PgVector + Postgres
  # Port Mapping: 5456:5432
  ioc-scale-db:
    image: ghcr.io/cisco-eti/ioc-scale-db:0.2.0
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    container_name: ioc-scale-db
    environment:
      POSTGRES_DB: ${IOC_SCALE_DB:-ioc-scale-db}
      POSTGRES_USER: ${IOC_SCALE_DB_USER}
      POSTGRES_PASSWORD: ${IOC_SCALE_DB_PASSWORD}
    ports:
      - "${IOC_SCALE_DB_PORT:-5456}:5432"
    volumes:
      - ioc_scale_db_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
      - ./scripts/ensure-databases.sh:/scripts/ensure-databases.sh:ro
    restart: unless-stopped
    healthcheck:
      test: [
          "CMD-SHELL",
          "ENSURE_DB_NO_WAIT=1 DB_HOST=localhost DB_PORT=5432 POSTGRES_DB=${IOC_SCALE_DB:-ioc-scale-db} POSTGRES_USER=${IOC_SCALE_DB_USER} POSTGRES_PASSWORD=${IOC_SCALE_DB_PASSWORD} /bin/sh /scripts/ensure-databases.sh && pg_isready -h localhost -p 5432 -U ${IOC_SCALE_DB_USER} -d ${IOC_SCALE_DB:-ioc-scale-db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Mgmt Backend Service - FastAPI backend for workspaces, users, CFN nodes
  # Port Mapping: 9000:9000
  ioc-scale-cf-mgmt-svc:
    # Image Link: https://github.com/cisco-eti/ioc-scale-cf-mgmt-svc/pkgs/container/ioc-scale-cf-mgmt-svc
    image: ghcr.io/cisco-eti/ioc-scale-cf-mgmt-svc:2026-09-30-ee7a726
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    container_name: ioc-scale-cf-mgmt-svc
    ports:
      - "9000:9000"
    environment:
      - SERVICE_NAME=ioc-scale-cf-mgmt-svc
      - APPLICATION_VERSION=dev
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ADMIN_USER_PASSWORD=${ADMIN_USER_PASSWORD}
      - POSTGRES_HOST=ioc-scale-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=cfn_mgmt
      - POSTGRES_USER=${IOC_SCALE_DB_USER}
      - POSTGRES_PASSWORD=${IOC_SCALE_DB_PASSWORD}
      - PORT=9000
      - CFN_DEV_MODE=${CFN_DEV_MODE}
      - CFN_SVC_URL=${CFN_SVC_URL:-http://ioc-cfn-svc:9002}
    volumes:
      - ./.secrets:/home/app/.secrets:ro
    restart: unless-stopped
    depends_on:
      ioc-scale-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://ioc-scale-cf-mgmt-svc:9000/api/internal/diagnostics/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Mgmt. Plane UI - Next.js frontend for management plane
  # Port Mapping: 9001:9001
  ioc-scale-cf-mgmt-plane-ui:
    # Image Link: https://github.com/cisco-eti/ioc-scale-cf-ui/pkgs/container/ioc-scale-cf-ui
    image: ghcr.io/cisco-eti/ioc-scale-cf-ui:2026-09-29-0209699
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    container_name: ioc-scale-cf-mgmt-plane-ui
    ports:
      - "9001:9001"
    environment:
      - NODE_ENV=production
      - PORT=9001
      - CFN_UI_API_BASE_URL=http://ioc-scale-cf-mgmt-svc:9000
      - NEXT_PUBLIC_CFN_UI_API_BASE_URL=http://localhost:9000
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:9001}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    restart: unless-stopped
    depends_on:
      ioc-scale-cf-mgmt-svc:
        condition: service_healthy

  # CFN Service - Cognition Fabric Node
  # Port Mapping: 9002:9002 (HTTP)
  ioc-scale-cfn-svc:
    # Image Link: https://github.com/cisco-eti/ioc-scale-cfn-svc/pkgs/container/ioc-scale-cfn-svc
    image: ghcr.io/cisco-eti/ioc-scale-cfn-svc:2026-09-29-fdee83e
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    container_name: ioc-scale-cfn-svc
    restart: unless-stopped
    ports:
      - "9002:9002"
      - "9003:9003"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MGMT_URL=${MGMT_URL:-http://ioc-scale-cf-mgmt-svc:9000}
      - CFN_NAME=${CFN_NAME:-cfn-new}
      - CFN_IP=${CFN_IP:-"Not Set"}
      - HEARTBEAT_INTERVAL_SECONDS=${HEARTBEAT_INTERVAL_SECONDS:-10}
      - SERVICE_NAME=${SERVICE_NAME:-ioc-cfn-svc}
      - POSTGRES_HOST=ioc-scale-db
      - POSTGRES_PORT=5432
      - POSTGRES_AUDIT_DB=cfn_audit
      - POSTGRES_USER=${IOC_SCALE_DB_USER}
      - POSTGRES_PASSWORD=${IOC_SCALE_DB_PASSWORD}
    depends_on:
      ioc-scale-db:
        condition: service_healthy
      ioc-scale-cf-mgmt-svc:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:9002/api/internal/diagnostics/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Demo CE
  # Port Mapping: 50051:50051 (gRPC)
  ioc-scale-cf-demo-ce:
    # Image Link: https://github.com/cisco-eti/ioc-scale-cf-demo-ce/pkgs/container/ioc-scale-cf-demo-ce%2Fce-demo
    image: ghcr.io/cisco-eti/ioc-scale-cf-demo-ce/ce-demo:2026-09-30-d51b466
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    container_name: ioc-scale-cf-demo-ce
    ports:
      - "50051:50051"
    restart: unless-stopped
    environment:
      - CFN_URL=http://ioc-scale-cfn-svc:9002
      - COGNITION_ENGINE_HOST=ioc-scale-cf-demo-ce
      - LOG_LEVEL=INFO
      - GRPC_PORT=50051
      # CE registration identity
      - CE_NAME=demo-ce
      - CE_VERSION=1.0.0
      - CE_TYPE=CASA
      - COGNITION_STORE_URL=http://oxp-api:8081
    depends_on:
      ioc-scale-cfn-svc:
        condition: service_healthy

  # ===========================================================================
  # OXP (Observability & Explainability Platform) stack
  # Message broker + Knowledge Graph store + claris-lib pipeline workers.
  # ===========================================================================

  # Message broker for OXP workers
  # Port Mapping: 5672 (AMQP), 15672 (management UI)
  # Erlang crashes on startup under x86 emulation, so this must match the host arch.
  rabbitmq:
    image: rabbitmq:3-management
    platform: ${OXP_INFRA_PLATFORM:-linux/arm64}
    container_name: ioc-scale-oxp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest} # legit:ignore
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
       
  oxp-api:
    build:
      context: ../oxp-lib
      dockerfile: api/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    image: oxp-api:local
    pull_policy: never
    env_file: .env
    container_name: ioc-scale-oxp-api
    environment:
      CACHE_REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-claris}
      NEO4J_HOST: neo4j
      NEO4J_PORT: ${NEO4J_PORT:-7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-testpassword}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    ports:
      - "8081:8000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    platform: ${OXP_INFRA_PLATFORM:-linux/arm64}
    container_name: ioc-scale-oxp-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Knowledge Graph store for OXP
  # Port Mapping: 7474 (HTTP), 7687 (Bolt)
  neo4j:
    image: neo4j:latest
    platform: ${OXP_INFRA_PLATFORM:-linux/arm64}
    container_name: ioc-scale-oxp-neo4j
    volumes:
      - oxp_neo4j_data:/data
      - oxp_neo4j_logs:/logs
      - oxp_neo4j_config:/config
      - oxp_neo4j_plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-testpassword} # legit:ignore
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Raw telemetry store for OXP. Workers read session spans from here.
  # Port Mapping: 8123 (HTTP, used by the workers), 9009 -> 9000 (native TCP).
  # The native port is published on 9009 because host 9000 is ioc-scale-cf-mgmt-svc.
  # Inside the compose network the collector still reaches it on 9000.
  clickhouse-server:
    image: clickhouse/clickhouse-server:24.8
    platform: ${OXP_INFRA_PLATFORM:-linux/arm64}
    container_name: ioc-scale-oxp-clickhouse
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin} # legit:ignore
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest} # legit:ignore
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - oxp_clickhouse_data:/var/lib/clickhouse
      - oxp_clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse-rabbitmq-config.xml:/etc/clickhouse-server/config.d/rabbitmq.xml:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # OTLP ingest for instrumented apps; writes spans/metrics/logs to ClickHouse.
  # Port Mapping: 4317 (gRPC), 4318 (HTTP)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    platform: ${OXP_INFRA_PLATFORM:-linux/arm64}
    container_name: ioc-scale-oxp-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    command: ["--config", "/etc/otel-collector-config.yaml"]
    environment:
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin} # legit:ignore
    restart: unless-stopped
    depends_on:
      clickhouse-server:
        condition: service_healthy

  # Creates the materialized columns and RabbitMQ-backed view after the
  # collector has created its trace table.
  oxp-clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    platform: ${OXP_INFRA_PLATFORM:-linux/arm64}
    container_name: ioc-scale-oxp-clickhouse-init
    entrypoint: ["/bin/sh", "/scripts/init-oxp-clickhouse.sh"]
    environment:
      CLICKHOUSE_HOST: clickhouse-server
      CLICKHOUSE_NATIVE_PORT: 9000
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin} # legit:ignore
      OXP_INIT_DELAY_SECONDS: ${OXP_INIT_DELAY_SECONDS:-5}
    volumes:
      - ./scripts/init-oxp-clickhouse.sh:/scripts/init-oxp-clickhouse.sh:ro
      - ./scripts/init-oxp-clickhouse.sql:/scripts/init-oxp-clickhouse.sql:ro
    restart: "no"
    depends_on:
      clickhouse-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Connects the ClickHouse exchange to the queue declared by norm.
  oxp-rabbitmq-init:
    image: rabbitmq:3-management
    platform: ${OXP_INFRA_PLATFORM:-linux/arm64}
    container_name: ioc-scale-oxp-rabbitmq-init
    entrypoint: ["/bin/sh", "/scripts/init-oxp-rabbitmq.sh"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_MANAGEMENT_PORT: 15672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest} # legit:ignore
    volumes:
      - ./scripts/init-oxp-rabbitmq.sh:/scripts/init-oxp-rabbitmq.sh:ro
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy
      norm:
        condition: service_started
      oxp-clickhouse-init:
        condition: service_completed_successfully

  # OXP: normalization worker (pipeline entry point)
  norm:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/claris/container-images}/claris-worker-norm:${CLARIS_IMAGE_TAG:-latest}
    container_name: ioc-scale-oxp-norm
    command: ["--max-sessions", "-1"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${NORM_MAX_INFLIGHT_MESSAGES:-64}
    restart: unless-stopped

  # OXP: embedding worker
  embedding:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/claris/container-images}/claris-worker-embedding:${CLARIS_IMAGE_TAG:-latest}
    container_name: ioc-scale-oxp-embedding
    command: ["--embedder-type", "OpenAIEmbedder", "--embedding-model", "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${EMBEDDING_MAX_INFLIGHT_MESSAGES:-16}
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      clickhouse-server:
        condition: service_healthy
      norm:
        condition: service_started

  # OXP: metrics computation engine worker
  mce:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/claris/container-images}/claris-worker-mce:${CLARIS_IMAGE_TAG:-latest}
    container_name: ioc-scale-oxp-mce
    command: ["--config-file", "/claris/mce_config.yaml"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${MCE_MAX_INFLIGHT_MESSAGES:-16}
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      clickhouse-server:
        condition: service_healthy
      norm:
        condition: service_started

  # OXP: semantic grouping worker
  grouping:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/claris/container-images}/claris-worker-grouping:${CLARIS_IMAGE_TAG:-latest}
    container_name: ioc-scale-oxp-grouping
    command: ["--embedding-model", "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${GROUPING_MAX_INFLIGHT_MESSAGES:-16}
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      clickhouse-server:
        condition: service_healthy
      norm:
        condition: service_started

  # OXP: analysis worker (anomaly / consistency / normal-behaviour)
  analysis:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/claris/container-images}/claris-worker-analysis:${CLARIS_IMAGE_TAG:-latest}
    container_name: ioc-scale-oxp-analysis
    command:
      - "--embedding-model"
      - "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${ANALYSIS_MAX_INFLIGHT_MESSAGES:-3}
      ANOMALY_CONFIG_FILE: ${ANOMALY_CONFIG_FILE:-}
      CONSISTENCY_CONFIG_FILE: ${CONSISTENCY_CONFIG_FILE:-}
      NORMAL_BEHAVIOUR_CONFIG_FILE: ${NORMAL_BEHAVIOUR_CONFIG_FILE:-}
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      clickhouse-server:
        condition: service_healthy
      norm:
        condition: service_started

  # OXP: hierarchical grouping worker
  hierarchical-grouping:
    <<: *worker-base
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/claris/container-images}/claris-worker-hierarchical-grouping:${CLARIS_IMAGE_TAG:-latest}
    container_name: ioc-scale-oxp-hierarchical-grouping
    command:
      - "--embedding-model"
      - "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${HIERARCHICAL_GROUPING_MAX_INFLIGHT_MESSAGES:-1}
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      clickhouse-server:
        condition: service_healthy
      norm:
        condition: service_started

  # MAS sample app. Emits the OTLP spans the OXP workers turn into a knowledge
  # graph, so the pipeline has something to process without a local checkout.
  # Port Mapping: 8125:8125 (HTTP). Host 8000 is ioc-scale-cf-cognition-engine,
  # and 8125 is what the app listens on by default.
  #
  # The only profiled service, so the stack stays usable without a gateway key:
  #   docker compose up -d                       # everything except this app
  #   docker compose --profile full-mas up -d    # everything, this app included
  # Every other service is unprofiled and starts either way.
  noa-trip-planner:
    profiles: ["full-mas"]
    image: ${CLARIS_REGISTRY:-ghcr.io/cisco-eti/claris/container-images}/noa-trip-planner:${NOA_IMAGE_TAG:-latest}
    platform: ${CLARIS_WORKER_PLATFORM:-linux/amd64}
    container_name: ioc-scale-noa-trip-planner
    env_file:
      - path: .env
        required: false
    ports:
      - "${NOA_API_PORT:-8125}:8125"
    environment:
      # Fixed inside the container; NOA_API_PORT above only moves the host port.
      NOA_API_PORT: 8125
      NOA_API_HOST: 0.0.0.0
      OTLP_HTTP_ENDPOINT: http://otel-collector:4318
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      NOA_LLM_MODEL: ${NOA_LLM_MODEL:-azure/gpt-4o}
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started

secrets:
  ARTIFACTORY_USERNAME:
    environment: "ARTIFACTORY_USERNAME"
  ARTIFACTORY_PASSWORD:
    environment: "ARTIFACTORY_PASSWORD"

volumes:
  ioc_scale_db_data:
  oxp_clickhouse_data:
  oxp_clickhouse_logs:
  oxp_neo4j_data:
  oxp_neo4j_logs:
  oxp_neo4j_config:
  oxp_neo4j_plugins:
