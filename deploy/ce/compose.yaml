services:
  ioc-scale-cf-demo-ce:
    profiles: [deploy-demo-ce]

  ioc-scale-cf-deploy-template-ce:
    profiles: [deploy-template-ce]
    image: ${CF_REGISTRY:-ghcr.io/ioc-project}/ioc-scale-cf-demo-ce/template-ce:${CF_TEMPLATE_CE_TAG:-latest}
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    container_name: ioc-scale-cf-deploy-template-ce
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8082:8082"
    restart: unless-stopped
    environment:
      CFN_URL: http://ioc-scale-cfn-svc:9002
      COGNITION_STORE_URL: http://ioc-analytics-api:8000
      COGNITION_ENGINE_HOST: ioc-scale-cf-deploy-template-ce
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
      HEALTH_PORT: "8082"
      CE_NAME: ${TEMPLATE_CE_NAME:-template-ce}
      TEMPLATE_CE_DECISION: ${TEMPLATE_CE_DECISION-allow}
      ENABLE_NOTIFICATIONS: ${ENABLE_NOTIFICATIONS-true}
    depends_on:
      ioc-scale-cfn-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/home/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
