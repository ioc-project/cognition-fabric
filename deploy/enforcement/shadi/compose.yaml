# SHADi enforcement flavor: the Go sender-authorization API (verifier). Trusted
# SHADi hosts reach it over mTLS and talk to each other directly over SLIM; deploy
# those separately. Overlay for the main stack; run from the repo root:
#   make -C deploy up enforcement=shadi
# or: docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/enforcement/shadi/compose.yaml up -d
# Needs enforcement/shadi/config/ with config.json, ca.crt, server.crt, server.key
# (see enforcement/shadi/README.md).
services:
  ioc-scale-enforcement-proxy-shadi-verifier:
    image: ${ENFORCEMENT_SHADI_IMAGE:-${PROXY_REGISTRY:-ghcr.io/ioc-project}/ioc-shadi-verifier:${ENFORCEMENT_SHADI_TAG:-latest}}
    platform: ${ENFORCEMENT_PLATFORM:-linux/arm64}
    container_name: ioc-scale-enforcement-proxy-shadi-verifier
    environment:
      SHADI_VERIFIER_CONFIG: /run/shadi-verifier/config.json
      SHADI_VERIFIER_TLS_CA_FILE: /run/shadi-verifier/ca.crt
      SHADI_VERIFIER_TLS_CERT_FILE: /run/shadi-verifier/server.crt
      SHADI_VERIFIER_TLS_KEY_FILE: /run/shadi-verifier/server.key
      # CF cfn-svc gRPC endpoint. Local CF is plaintext; TLS is the default elsewhere.
      CF_ENFORCEMENT_ADDRESS: ${CF_ENFORCEMENT_ADDRESS:-ioc-scale-cfn-svc:9003}
      CF_ENFORCEMENT_TIMEOUT: ${CF_ENFORCEMENT_TIMEOUT:-2s}
      CF_ENFORCEMENT_ALLOW_PLAINTEXT: ${CF_ENFORCEMENT_ALLOW_PLAINTEXT:-true}
      ENFORCEMENT_FAILURE_POSTURE: ${ENFORCEMENT_FAILURE_POSTURE:-fail_closed}
      AUDIT_QUEUE_CAPACITY: ${AUDIT_QUEUE_CAPACITY:-256}
      AUDIT_RPC_TIMEOUT: ${AUDIT_RPC_TIMEOUT:-2s}
      MAX_MEDIATED_BODY_BYTES: ${MAX_MEDIATED_BODY_BYTES:-1048576}
      AUDIT_CAPTURE_MAX_BYTES: ${AUDIT_CAPTURE_MAX_BYTES:-65536}
      AUDIT_REDACT_PATTERNS: ${AUDIT_REDACT_PATTERNS:-["(?i)token=[^&\\s]+","(?i)\"token\"\\s*:\\s*\"[^\"]+\""]}
    ports:
      - "127.0.0.1:${SHADI_VERIFIER_PORT:-9013}:8443"
    volumes:
      - type: bind
        # Must be readable by UID/GID 65532 (the image runs as nonroot).
        source: ${SHADI_VERIFIER_CONFIG_DIR:-./enforcement/shadi/config}
        target: /run/shadi-verifier
        read_only: true
        bind:
          create_host_path: false
