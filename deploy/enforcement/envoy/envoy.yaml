# Example Envoy bootstrap for the enforcement sidecar. Two listeners (inbound 18080,
# outbound 18081), each running the traceparent Wasm filter, then the Go sidecar
# filter, then the router. Keep that order. Both read /etc/sidecar/sidecar-spec.yaml.
# The cluster below points at ioc-scale-enforcement-proxy-upstream (a test echo server); retarget it
# at your real application.
static_resources:
  listeners:
    - name: inbound_enforcement_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 18080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: inbound_enforcement_http
                route_config:
                  name: upstream_routes
                  virtual_hosts:
                    - name: upstream
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: upstream }
                http_filters:
                  # First in the chain is the Envoy AUTHN-equivalent phase: it
                  # only injects a missing traceparent before Go mediates.
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: ioc.traceparent
                        root_id: ioc_traceparent
                        vm_config:
                          vm_id: ioc_traceparent_vm
                          runtime: envoy.wasm.runtime.v8
                          code:
                            local:
                              filename: /etc/sidecar/wasm/ioc_traceparent.wasm
                  - name: envoy.filters.http.golang
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.golang.v3alpha.Config
                      library_id: ioc-sidecar-core
                      library_path: /etc/sidecar/plugins/ioc_sidecar_core.so
                      plugin_name: ioc_sidecar_core
                      plugin_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{"spec_path":"/etc/sidecar/sidecar-spec.yaml","direction":"inbound"}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: outbound_enforcement_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 18081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: outbound_enforcement_http
                route_config:
                  name: outbound_upstream_routes
                  virtual_hosts:
                    - name: upstream
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: upstream }
                http_filters:
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: ioc.traceparent
                        root_id: ioc_traceparent
                        vm_config:
                          vm_id: ioc_traceparent_vm
                          runtime: envoy.wasm.runtime.v8
                          code:
                            local:
                              filename: /etc/sidecar/wasm/ioc_traceparent.wasm
                  - name: envoy.filters.http.golang
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.golang.v3alpha.Config
                      library_id: ioc-sidecar-core
                      library_path: /etc/sidecar/plugins/ioc_sidecar_core.so
                      plugin_name: ioc_sidecar_core
                      plugin_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{"spec_path":"/etc/sidecar/sidecar-spec.yaml","direction":"outbound"}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: upstream
      connect_timeout: 2s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: ioc-scale-enforcement-proxy-upstream, port_value: 8080 }
admin:
  access_log_path: /tmp/envoy-admin.log
  address:
    socket_address: { address: 0.0.0.0, port_value: 19000 }
