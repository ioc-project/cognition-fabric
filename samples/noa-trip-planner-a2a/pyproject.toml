[project]
name = "noa-trip-planner-a2a"
version = "0.1.0"
description = "Multi-agent trip planner using A2A over SLIM and MCP tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[sqlite,telemetry]==1.2.3",
    "fastapi>=0.115.0",
    "griffe>=1.15.0,<2.0.0",
    "langchain[mcp]>=1.4.2,<2.0.0",
    "uvicorn>=0.32.0",
    "langchain-core>=1.2.5",
    "langchain-openai>=0.2.9",
    "langgraph>=0.2.45",
    "mcp>=2.0.0,<3.0.0",
    "networkx>=3.4.2",
    "ipython>=8.18.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-dotenv>=1.2.1",
    "ioa-observe-sdk>=1.1.1",
    "slim-bindings>=3.3.6",
    "slima2a==0.9.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noa_trip_planner"]

[project.scripts]
main = "noa_trip_planner.api:main"
mcp-server = "noa_trip_planner.tooling.mcp_server:main"
