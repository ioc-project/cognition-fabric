version: '3.8'

services:
  casa-ce:
    build:
      context: ./engines/casa
      dockerfile: Dockerfile
    container_name: casa-ce
    ports:
      - "50051:50051"
    environment:
      - LOG_LEVEL=INFO
      - GRPC_PORT=50051
      # Optional: CFN registration (uncomment to enable)
      # - CFN_URL=http://cfn:9002
      # - COGNITION_ENGINE_HOST=casa-ce
      # Optional: Cognition Store (uncomment to enable)
      # - COGNITION_STORE_URL=http://cognition-store:8080
    restart: unless-stopped
