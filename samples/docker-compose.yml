services:
  # Policy-driven CE, built from policy-ce/Dockerfile. The build needs a GitHub token able to read the private
  # cisco-eti/ioc-scale-cfn-svc module: export GITHUB_TOKEN before running.
  # Start with: docker compose up --build
  policy-ce:
    build:
      context: ./policy-ce
      dockerfile: Dockerfile
      secrets:
        - github_token
    image: policy-ce:dev
    container_name: policy-ce
    ports:
      - "18001:18001"
    environment:
      - CE_NAME=policy-ce
      - ADVERTISED_GRPC_ADDRESS=policy-ce:18001
      - CE_POLICY_FILE=/etc/policy-ce/policy.json
      - CFN_URL=http://host.docker.internal:9002
      - OXP_API_URL=http://host.docker.internal:8000
      - CE_CONTEXT_WAIT=${CE_CONTEXT_WAIT:-1s}
      - CE_CONTEXT_ATTEMPTS=${CE_CONTEXT_ATTEMPTS:-5}
      - CE_CONTEXT_RETRY_WAIT=${CE_CONTEXT_RETRY_WAIT:-0.2s}
    volumes:
      - ./policy-ce/config/policy.json:/etc/policy-ce/policy.json:ro
    restart: unless-stopped

secrets:
  github_token:
    environment: GITHUB_TOKEN
