version: '3.8'

services:
  demo-ce:
    build:
      context: ./demo-ce
      dockerfile: Dockerfile
    container_name: demo-ce
    ports:
      - "50051:50051"
    environment:
      - LOG_LEVEL=INFO
      - GRPC_PORT=50051
      # CE registration identity
      - CE_NAME=demo-ce
      - CE_VERSION=1.0.0
      - CE_TYPE=CASA
      # For local development (connecting to services on host machine)
      - CFN_URL=http://host.docker.internal:9002
      - COGNITION_STORE_URL=http://host.docker.internal:8000
      # For Docker network (when running alongside other containers)
      # - CFN_URL=http://cfn:9002
      # - COGNITION_STORE_URL=http://oxp-api:8000
      # - COGNITION_ENGINE_HOST=demo-ce
    restart: unless-stopped

  # Policy-driven CE, built from policy-ce/Dockerfile. The build needs a GitHub token able to read the private
  # cisco-eti/ioc-scale-cfn-svc module: export GITHUB_TOKEN before running.
  # Opt in with: docker-compose --profile policy-ce up --build policy-ce
  policy-ce:
    build:
      context: ./policy-ce
      dockerfile: Dockerfile
      secrets:
        - github_token
    image: policy-ce:dev
    container_name: policy-ce
    profiles:
      - policy-ce
    ports:
      - "18001:18001"
    environment:
      - CE_NAME=policy-ce
      - ADVERTISED_GRPC_ADDRESS=policy-ce:18001
      - CE_POLICY_FILE=/etc/policy-ce/policy.json
      - CFN_URL=http://host.docker.internal:9002
      - OXP_API_URL=http://host.docker.internal:8000
    volumes:
      - ./policy-ce/examples/policy.json:/etc/policy-ce/policy.json:ro
    restart: unless-stopped

secrets:
  github_token:
    environment: GITHUB_TOKEN
