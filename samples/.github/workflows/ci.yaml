name: Demo CE CI workflow

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

# Grant read access for GITHUB_TOKEN on all jobs
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout
  packages: write # needed to push docker image to gar or ecr

jobs:
  ################################## demo-ce (Go) ##############################
  ###############################################################################
  # demo-ce depends on the private module github.com/cisco-eti/ioc-scale-cfn-svc. As in the enforcement proxy
  # CI, a short-lived GitHub App token scoped to that repository is issued through Vault (./.github/actions/cfn-token,
  # which needs the vars KEEPER_URL, VAULT_NAMESPACE, VAULT_SECRET_PATH and the secrets VAULT_APPROLE_ROLE_ID
  # and VAULT_APPROLE_SECRET_ID).
  demo-ce-unit-tests:
    name: demo-ce Unit Tests
    runs-on:
      group: ${{ vars.DEFAULT_ARC_RUNNERS }}
    env:
      GOPRIVATE: github.com/cisco-eti/*
      GONOSUMDB: github.com/cisco-eti/*
      GIT_CONFIG_GLOBAL: /tmp/cfn-gitconfig

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: demo-ce/go.mod
          cache-dependency-path: demo-ce/go.sum

      - name: Generate CFN module token
        id: cfn-token
        uses: ./.github/actions/cfn-token
        with:
          vault-url: ${{ vars.KEEPER_URL }}
          vault-namespace: ${{ vars.VAULT_NAMESPACE }}
          vault-secret-path: ${{ vars.VAULT_SECRET_PATH }}
          role-id: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
          secret-id: ${{ secrets.VAULT_APPROLE_SECRET_ID }}

      - name: Authenticate Git for the private CFN module
        env:
          CFN_TOKEN: ${{ steps.cfn-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${CFN_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Run Unit Tests
        run: |
          cd demo-ce
          go vet ./...
          go test ./...

      - name: Remove CFN module credentials
        if: always()
        run: rm -f "$GIT_CONFIG_GLOBAL"

  # Demo CE images are published from main; PRs and manual runs validate the build.
  demo-ce-docker-build-push:
    name: demo-ce Build & Push Docker Image
    needs: [ demo-ce-unit-tests ]
    runs-on:
      group: ${{ vars.DEFAULT_ARC_RUNNERS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generate CFN module token
        id: cfn-token
        uses: ./.github/actions/cfn-token
        with:
          vault-url: ${{ vars.KEEPER_URL }}
          vault-namespace: ${{ vars.VAULT_NAMESPACE }}
          vault-secret-path: ${{ vars.VAULT_SECRET_PATH }}
          role-id: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
          secret-id: ${{ secrets.VAULT_APPROLE_SECRET_ID }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (validation only)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: demo-ce
          file: demo-ce/Dockerfile
          push: false
          platforms: linux/amd64
          secrets: |
            github_token=${{ steps.cfn-token.outputs.token }}
          tags: |
            ghcr.io/${{ github.repository }}/demo-ce:${{ steps.meta.outputs.build_date }}-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=demo-ce
          cache-to: type=gha,mode=max,scope=demo-ce
          provenance: false

      - name: Build and push Docker image (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: demo-ce
          file: demo-ce/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          secrets: |
            github_token=${{ steps.cfn-token.outputs.token }}
          tags: |
            ghcr.io/${{ github.repository }}/demo-ce:latest
            ghcr.io/${{ github.repository }}/demo-ce:${{ steps.meta.outputs.build_date }}-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=demo-ce
          cache-to: type=gha,mode=max,scope=demo-ce
          provenance: false

  ################################## template-ce (Python) ######################
  ###############################################################################
  template-ce-unit-tests:
    name: template-ce Unit Tests
    runs-on:
      group: ${{ vars.DEFAULT_ARC_RUNNERS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Run Unit Tests
        run: |
          cd template-ce
          uv sync --frozen --extra test
          uv run pytest

  # Template CE images are published from main; PRs and manual runs validate the build.
  template-ce-docker-build-push:
    name: template-ce Build & Push Docker Image
    needs: [ template-ce-unit-tests ]
    runs-on:
      group: ${{ vars.DEFAULT_ARC_RUNNERS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (validation only)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: template-ce
          file: template-ce/Dockerfile
          push: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}/template-ce:${{ steps.meta.outputs.build_date }}-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=template-ce
          cache-to: type=gha,mode=max,scope=template-ce
          provenance: false

      - name: Build and push Docker image (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: template-ce
          file: template-ce/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/template-ce:latest
            ghcr.io/${{ github.repository }}/template-ce:${{ steps.meta.outputs.build_date }}-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=template-ce
          cache-to: type=gha,mode=max,scope=template-ce
          provenance: false

  ################################## Send Status for PR Checks ###########################
  ########################################################################################
  # This Job is REQUIRED, it is what allows for the WHOLE workflow to show up in the PR status checks as a requirement for branch rules
  reusable-workflow-ci-status:
    name: Reusable Workflow CI Status
    # This should be an array of ALL active jobs that are used/run
    needs: [ demo-ce-unit-tests, demo-ce-docker-build-push, template-ce-unit-tests, template-ce-docker-build-push ]
    if: always()
    runs-on:
      group: ${{ vars.DEFAULT_ARC_RUNNERS }}
    steps:
      - name: report failure
        if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
        run: |
          echo -e "\033[31m*** WORKFLOW FAILED ***\033[0m"
          exit 1
      - name: report success
        run: |
          echo -e "\033[1;36m*** WORKFLOW SUCCESS ***\033[0m"
          exit 0
