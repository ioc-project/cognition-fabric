[project]
name = "noa-trip-planner"
version = "0.1.0"
description = "Multi-agent trip planner system with dynamic routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "langchain-core>=1.2.5",
    "langchain-openai>=0.2.9",
    "langgraph>=0.2.45",
    "networkx>=3.4.2",
    "ipython>=8.18.0",
    "python-dotenv>=1.2.1",
    "ioa-observe-sdk>=1.1.1",
    "grpcio>=1.60.0",
    "protobuf>=7.36.2,<8",
    "typing-extensions>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noa_trip_planner"]

[project.scripts]
main = "noa_trip_planner.api:main"
quiet_ask = "noa_trip_planner.multi_agent_system:run_quiet"

[dependency-groups]
experiments = ["httpx>=0.27.0"]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]
