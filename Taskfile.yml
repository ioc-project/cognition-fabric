version: "3"

dotenv:
  - .env

vars:
  INTEGRATION_PG_PORT: "55432"
  INTEGRATION_PG_DB: cfn_audit_test
  INTEGRATION_PG_USER: postgres
  # Same test password as .github/workflows/ci.yaml; not a production secret.
  INTEGRATION_PG_PASSWORD: localdev
  INTEGRATION_COMPOSE_FILE: cfn/test/integration/compose.yaml

tasks:
  test:
    desc: Run all eight Cognition Fabric test suites
    silent: true
    cmds:
      - bash dev/cf-local.sh test

  test:dev:
    desc: Test local launchers, helpers, release dispatch and Pages staging without starting services
    dir: cf-mgmt
    cmds:
      - poetry run python -m unittest discover -s ../dev/tests -v
      - poetry run python -m unittest discover -s ../.github/tests -v

  test:noa:
    desc: Test the bundled native NOA A2A application
    dir: samples/noa-trip-planner-a2a
    cmds:
      - uv run --frozen --group dev python -m pytest tests -q

  proto:
    desc: Regenerate shared Go bindings from canonical API contracts
    cmds:
      - make -C api proto

  proto:check:
    desc: Check generated Go bindings without changing the reviewed tree
    cmds:
      - make -C api proto-check

  test:integration:db:
    desc: Start throwaway Postgres for CFN integration tests (no-op when INTEGRATION_SKIP_DB=true)
    cmds:
      - |
        if [ "${INTEGRATION_SKIP_DB:-}" = "true" ]; then
          echo "using existing Postgres (INTEGRATION_SKIP_DB=true)"
          exit 0
        fi
        docker compose -f {{.INTEGRATION_COMPOSE_FILE}} up -d --wait

  test:integration:
    desc: Run CFN process-level integration tests (Docker required locally)
    env:
      POSTGRES_USER: "{{.INTEGRATION_PG_USER}}"
      POSTGRES_PASSWORD: "{{.INTEGRATION_PG_PASSWORD}}"
      POSTGRES_AUDIT_DB: "{{.INTEGRATION_PG_DB}}"
      POSTGRES_HOST:
        sh: 'if [ "${INTEGRATION_SKIP_DB:-}" = "true" ]; then echo "${POSTGRES_HOST:-localhost}"; else echo "127.0.0.1"; fi'
      POSTGRES_PORT:
        sh: 'if [ "${INTEGRATION_SKIP_DB:-}" = "true" ]; then echo "${POSTGRES_PORT:-5432}"; else echo "{{.INTEGRATION_PG_PORT}}"; fi'
    cmds:
      - task: test:integration:db
      - defer: |
          if [ "${INTEGRATION_SKIP_DB:-}" = "true" ]; then
            exit 0
          fi
          docker compose -f {{.INTEGRATION_COMPOSE_FILE}} down -v
      - go -C cfn vet -tags integration ./test/integration/...
      - go -C cfn test -v -tags integration -count=1 ./test/integration/...

  check:
    desc: Check formatting, lint, and types before running CF tests
    silent: true
    cmds:
      - bash dev/cf-local.sh check

  deploy:up:
    desc: Pull deployment images and start CF with the selected enforcement flavor
    cmds:
      - |
        set -- ${DEPLOY_ENFORCEMENT:+"enforcement=$DEPLOY_ENFORCEMENT"}
        case "${DEPLOY_PULL:-true}" in
          true) make -C deploy pull "$@" || exit $? ;;
          false) ;;
          *) printf '%s\n' 'DEPLOY_PULL must be true or false' >&2; exit 2 ;;
        esac
        make -C deploy up "$@"

  deploy:down:
    desc: Stop the CF deployment stack and preserve volumes
    cmds:
      - make -C deploy down

  infra:up:
    desc: Start Postgres and OXP infrastructure; start the MAS/proxy after onboarding
    silent: true
    cmds:
      - bash dev/cf-local.sh infra-up

  infra:down:
    desc: Stop the local MAS/proxy, CF images and infrastructure without deleting volumes
    silent: true
    cmds:
      - bash dev/cf-local.sh infra-down

  proxy:logs:
    desc: Follow the upstream local proxy controller logs
    silent: true
    cmds:
      - bash dev/cf-local.sh proxy-logs

  noa:status:
    desc: Show the local NOA A2A and Proxy status
    silent: true
    cmds:
      - bash dev/cf-local.sh noa-status

  noa:down:
    desc: Retire the local NOA A2A proxy and stop its MAS containers
    silent: true
    cmds:
      - bash dev/cf-local.sh noa-down

  run:cfn-mgmt:
    desc: Migrate the local management database and run management from source
    silent: true
    cmds:
      - bash dev/cf-local.sh run-cfn-mgmt

  run:cfn-mgmt:image:
    desc: Pull CF_MGMT_SVC_TAG (default latest) and run management against the local database
    silent: true
    cmds:
      - bash dev/cf-local.sh run-cfn-mgmt-image

  run:cfn:
    desc: Run CFN from source against the local CF databases
    silent: true
    cmds:
      - bash dev/cf-local.sh run-cfn

  run:cfn:image:
    desc: Pull CFN_SVC_TAG (default latest) and run CFN against local management and audit
    silent: true
    cmds:
      - bash dev/cf-local.sh run-cfn-image

  run:cf-ui:
    desc: Run the management UI from source
    silent: true
    cmds:
      - bash dev/cf-local.sh run-cf-ui

  run:cf-ui:image:
    desc: Pull CF_UI_TAG (default latest) and run the UI against local management
    silent: true
    cmds:
      - bash dev/cf-local.sh run-cf-ui-image

  run:template-ce:
    desc: Run the Python template CE from source against local CFN and shared OXP
    silent: true
    cmds:
      - bash dev/cf-local.sh run-template-ce

  run:template-ce:image:
    desc: Pull CF_TEMPLATE_CE_TAG (default latest) and run the Python template CE
    silent: true
    cmds:
      - bash dev/cf-local.sh run-template-ce-image

  run:demo-ce:
    desc: Run the Go demo CE from source using CE_CONFIG_FILE against local CFN and OXP
    silent: true
    cmds:
      - bash dev/cf-local.sh run-demo-ce

  run:demo-ce:image:
    desc: Pull CF_DEMO_CE_TAG (default latest) and run the Go demo CE using CE_CONFIG_FILE
    silent: true
    cmds:
      - bash dev/cf-local.sh run-demo-ce-image

  run:full-mas:
    desc: Build and run native NOA A2A with the Enforcement Proxy
    silent: true
    cmds:
      - bash dev/cf-local.sh run-full-mas
