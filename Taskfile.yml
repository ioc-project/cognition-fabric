version: '3'

dotenv:
  - .env

tasks:
  test:
    desc: Run tests in the sibling CF source repositories
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh test

  check:
    desc: Check formatting, lint, and types before running CF tests
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh check

  infra:up:
    desc: Start local infrastructure, including Envoy when NOA_ENFORCEMENT_MODE=proxy
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh infra-up

  infra:down:
    desc: Stop local CF images, infrastructure, and local Envoy without deleting volumes
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh infra-down

  proxy:logs:
    desc: Follow the local Envoy and mediation service logs
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh proxy-logs

  run:cfn-mgmt:
    desc: Migrate the local management database and run management from source
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh run-cfn-mgmt

  run:cfn-mgmt:image:
    desc: Pull CF_MGMT_SVC_TAG (default latest) and run management against the local database
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh run-cfn-mgmt-image

  run:cfn:
    desc: Run CFN from source against the local CF databases
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh run-cfn

  run:cfn:image:
    desc: Pull CFN_SVC_TAG (default latest) and run CFN against local management and audit
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh run-cfn-image

  run:cf-ui:
    desc: Run the management UI from source
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh run-cf-ui

  run:cf-ui:image:
    desc: Pull CF_UI_TAG (default latest) and run the UI against local management
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh run-cf-ui-image

  run:template-ce:
    desc: Run the Python template CE from source against local CFN and shared OXP
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh run-template-ce

  run:demo-ce:
    desc: Run the Go demo CE from source using CE_CONFIG_FILE against local CFN and OXP
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh run-demo-ce

  run:demo-ce:image:
    desc: Pull CF_DEMO_CE_TAG (default latest) and run the Go demo CE using CE_CONFIG_FILE
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh run-demo-ce-image

  run:full-mas:
    desc: Run NOA using NOA_MODE and NOA_ENFORCEMENT_MODE from .env
    silent: true
    cmds:
      - bash deploy/local/cf-local.sh run-full-mas
