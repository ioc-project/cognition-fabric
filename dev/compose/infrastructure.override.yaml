# The monorepo root .env configures both Compose interpolation and containers.
# Resolve deploy/ env_file lists explicitly from the monorepo root.
x-root-env: &root-env
  env_file: !override
    - ${CF_LOCAL_ENV_FILE:?Run through the monorepo local tasks}

services:
  ioc-analytics-api:
    <<: *root-env
    environment:
      # IOC_SCALE_DB_PORT is the published host port, not the Docker service port.
      POSTGRES_PORT: "5432"
  norm: *root-env
  noa-trip-planner: *root-env
