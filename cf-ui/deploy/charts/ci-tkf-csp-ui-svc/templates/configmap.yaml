apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configmap
  namespace: '{{ .Release.Namespace }}'
data:
  # Runtime environment variables for Next.js
  # These are injected by entrypoint.sh as NEXT_PUBLIC_* variables
  API_URL: '{{ .Values.api.url }}'
  LOG_LEVEL: '{{ .Values.logLevel }}'
  IAM_PRODUCT_ID: '{{ .Values.iam.productId }}'
  IAM_UI: '{{ .Values.iam.ui }}'
  IAM_API: '{{ .Values.iam.api }}'
  IAM_OIDC_ISSUER: '{{ .Values.iam.oidc.issuer }}'
  IAM_OIDC_CLIENT_ID: '{{ .Values.iam.oidc.clientId }}'
  IAM_OIDC_SCOPES: '{{ .Values.iam.oidc.scopes }}'
  CCI_UI: '{{ .Values.cci.ui }}'
  CCI_OIDC_ISSUER: '{{ .Values.cci.oidc.issuer }}'
  CCI_OIDC_CLIENT_ID: '{{ .Values.cci.oidc.clientId }}'
  CCI_OIDC_SCOPES: '{{ .Values.cci.oidc.scopes }}'
  SEGMENT_ID: '{{ .Values.analytics.segment_id }}'
  AUTH_PROVIDER: '{{ .Values.authProvider }}'
