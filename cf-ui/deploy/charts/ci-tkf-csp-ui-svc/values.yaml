# Master values
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt
domainPrefix: ci-tkf-csp-ui-svc
cluster:
  apiDomainName: dev.eticloud.io

replicas: 1
serviceName: ci-tkf-csp-ui-svc
servicePort: 3000
docker:
  registry: 626007623524.dkr.ecr.us-east-2.amazonaws.com
  image: ci-tkf-csp-ui-svc
tagversion: latest

# Custom
logLevel: info
authProvider: an_auth_provider
api:
  url: an_api_url
iam:
  productId: a_product_id
  ui: an_ui_url
  api: an_api_url
  oidc:
    clientId: a_client_id
    scopes: openid
    issuer : an_oidc_issuer
cci:
  ui: an_ui_url
  oidc:
    clientId: a_client_id
    scopes: openid
    issuer : an_oidc_issuer
analytics:
  segment_id: a_segment_id
