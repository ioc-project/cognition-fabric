name: CI workflow

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ################################## Test & Validation ##############################
  ###############################################################################
  test-and-validate:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint:check

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

  ################################## Security Scan ##############################
  ###############################################################################
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate || true

  ################################## Status Check ##############################
  ###############################################################################
  ci-status:
    name: CI Status Check
    needs: [test-and-validate, security-scan]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Report failure
        if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
        run: |
          echo -e "\033[31m*** CI FAILED - Tests or validation failed ***\033[0m"
          exit 1

      - name: Report success
        run: |
          echo -e "\033[1;36m*** CI PASSED - All tests and validation successful ***\033[0m"
          exit 0
