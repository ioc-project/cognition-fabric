services:
  app:
    build:
      context: .
      dockerfile: ./ci/docker/Dockerfile.next
      args:
        CFN_UI_API_BASE_URL: ${CFN_UI_API_BASE_URL:-http://host.docker.internal:9000}
    image: ioc-cfn-mgmt-plane-ui:latest
    container_name: ioc-cfn-mgmt-plane-ui
    ports:
      - '9001:9001'
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - CFN_UI_AUDIT_REFRESH_INTERVAL_SECONDS=${CFN_UI_AUDIT_REFRESH_INTERVAL_SECONDS:-30}
      - CFN_UI_AUDIT_FLASH_DURATION_SECONDS=${CFN_UI_AUDIT_FLASH_DURATION_SECONDS:-60}
    restart: unless-stopped
