name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ui-arm64:
        description: Build the UI image for AMD64 and ARM64 without publishing
        type: boolean
        default: false
  workflow_call:
    inputs:
      include-images:
        description: Build validation images after the test suites
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  api:
    name: API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.9'
          cache-dependency-path: api/go.sum
      - run: make -C api lint test

  cfn:
    name: CFN checks and process integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: cfn_audit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_AUDIT_DB: cfn_audit_test
      POSTGRES_TEST_DB: cfn_audit_test
      INTEGRATION_SKIP_DB: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.9'
          cache-dependency-path: |
            api/go.sum
            cfn/go.sum
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
      - run: make -C cfn lint test
      - run: task test:integration
      - name: Build outside Go workspace
        working-directory: cfn
        run: GOWORK=off go build ./...

  management:
    name: Management checks and schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgresUser
          POSTGRES_PASSWORD: postgresPW
          POSTGRES_DB: ioc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgresUser
      POSTGRES_PASSWORD: postgresPW
      POSTGRES_DB: ioc_test
      PYTHON_DOTENV_DISABLED: '1'
    defaults:
      run:
        working-directory: cf-mgmt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install poetry==2.2.1
      - run: poetry install --no-interaction
      - run: bash scripts/lint.sh --check
      - run: poetry run pytest tests/ -v
      - run: poetry run python scripts/generate_openapi_spec.py --check
      - run: poetry run python -m unittest discover -s ../dev/tests -v

  ui:
    name: UI checks and generated types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cf-ui/package-lock.json
      - run: npm ci
      - run: npm run check:api
      - run: npm test
      - run: npm run lint:check
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dependency audit (advisory, preserving existing policy)
        run: npm audit --audit-level=moderate || true

  demo-ce:
    name: Demo CE checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/demo-ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.9'
          cache-dependency-path: |
            api/go.sum
            samples/demo-ce/go.sum
      - name: Check Go formatting without rewriting files
        run: |
          if [ -n "$(gofmt -l .)" ]; then gofmt -d .; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: GOWORK=off go build ./...

  template-ce:
    name: Template CE checks and image smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/template-ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.11'
          version: '0.13.7'
      - run: uv sync --frozen --extra test
      - run: uv run --frozen python scripts/generate_proto.py --check
      - run: uv run --frozen pytest
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: samples/template-ce/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: template-ce:smoke
          cache-from: type=gha,scope=template-ce
      - name: Probe disposable image health and GetInfo
        run: |
          docker run -d --name template-ce-smoke template-ce:smoke
          trap 'docker rm -f template-ce-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec template-ce-smoke /home/app/.venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"; then
              break
            fi
            if [ "$i" -eq 30 ]; then docker logs template-ce-smoke; exit 1; fi
            sleep 1
          done
          docker cp scripts/smoke_image.py template-ce-smoke:/tmp/smoke_image.py
          docker exec -e PYTHONPATH=/home/app/src -w /tmp template-ce-smoke /home/app/.venv/bin/python /tmp/smoke_image.py

  noa:
    name: NOA sample and onboarding tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/noa-trip-planner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.11'
          version: '0.13.7'
      - run: uv sync --frozen --group dev
      - run: uv run --frozen --group dev python -m pytest tests -q

  generation:
    name: Protobuf and internal Swagger drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.9'
          cache-dependency-path: |
            api/go.sum
            cfn/go.sum
      - name: Install pinned generation tools
        run: |
          curl -fsSL --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          echo "6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  $RUNNER_TEMP/protoc.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.11'
          version: '0.13.7'
      - run: uv sync --frozen --extra test --project samples/template-ce
      - run: make -C api proto-check
      - run: make -C api openapi-check
      - run: make -C cfn docs-check

  automation:
    name: Release and Pages automation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s .github/tests -v
      - name: Validate all component metadata and release mappings
        run: python .github/scripts/release_target.py --validate-all

  docs:
    name: Combined Pages artifact build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: samples/docs-site/package-lock.json
      - run: npm ci --prefix samples/docs-site
      - name: Build site at project subpath
        run: npm run build --prefix samples/docs-site
        env:
          PAGES_URL: https://cisco-eti.github.io/cognition-fabric/
      - run: python3 .github/scripts/build_pages.py --output "$RUNNER_TEMP/pages-project"
      - name: Build site at root path
        run: npm run build --prefix samples/docs-site
        env:
          PAGES_URL: https://example.invalid/
      - run: python3 .github/scripts/build_pages.py --output "$RUNNER_TEMP/pages-root"

  images:
    name: Image (${{ matrix.component }})
    needs: [api, cfn, management, ui, demo-ce, template-ce, noa, generation, automation, docs]
    if: ${{ toJSON(inputs.include-images) != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: cfn
            image: ghcr.io/cisco-eti/ioc-scale-cfn-svc
            dockerfile: cfn/Dockerfile
          - component: cf-mgmt
            image: ghcr.io/cisco-eti/ioc-scale-cf-mgmt-svc
            dockerfile: cf-mgmt/Dockerfile
          - component: cf-ui
            image: ghcr.io/cisco-eti/ioc-scale-cf-ui
            dockerfile: cf-ui/ci/docker/Dockerfile.next
          - component: demo-ce
            image: ghcr.io/cisco-eti/ioc-scale-cf-demo-ce/demo-ce
            dockerfile: samples/demo-ce/Dockerfile
          - component: template-ce
            image: ghcr.io/cisco-eti/ioc-scale-cf-demo-ce/template-ce
            dockerfile: samples/template-ce/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up QEMU for Management
        if: matrix.component == 'cf-mgmt'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Select preserved main aliases or local validation tag
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
          COMPONENT: ${{ matrix.component }}
        run: |
          {
            echo 'tags<<EOF'
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "$IMAGE:latest"
              echo "$IMAGE:$(date -u +%Y-%m-%d)-${GITHUB_SHA:0:7}"
              if [ "$COMPONENT" = cf-mgmt ] || [ "$COMPONENT" = cf-ui ]; then echo "$IMAGE:main"; fi
            else
              echo "$IMAGE:ci-${GITHUB_SHA:0:7}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: >-
            ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                 (github.event_name == 'workflow_dispatch' && inputs.ui-arm64 && matrix.component == 'cf-ui'))
                && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CFN_UI_API_BASE_URL=${{ vars.CFN_UI_API_BASE_URL || 'http://localhost:9000' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false

  ci-status:
    name: CI Status
    if: always()
    needs: [api, cfn, management, ui, demo-ce, template-ce, noa, generation, automation, docs, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every suite and image build
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          INCLUDE_IMAGES_JSON: ${{ toJSON(inputs.include-images) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["NEEDS_JSON"])
          include_images = json.loads(os.environ["INCLUDE_IMAGES_JSON"])
          if not jobs or "images" not in jobs:
              sys.exit("Missing required job results")
          for name, job in jobs.items():
              result = job["result"]
              if name == "images" and include_images is False and result == "skipped":
                  continue
              if result != "success":
                  sys.exit(f"Required job {name} did not succeed: {result}")
          PY
