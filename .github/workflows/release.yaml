name: Component release

on:
  push:
    tags:
      - 'api/v*'
      - 'cfn/v*'
      - 'cf-mgmt/v*'
      - 'cf-ui/v*'
      - 'samples/demo-ce/v*'
      - 'samples/template-ce/v*'

permissions:
  contents: read
  packages: write

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      historical: ${{ steps.target.outputs.historical }}
      publish_image: ${{ steps.target.outputs.publish_image }}
      image: ${{ steps.target.outputs.image }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      dockerfile: ${{ steps.target.outputs.dockerfile }}
      component: ${{ steps.target.outputs.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - id: target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_target.py "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  checks:
    needs: target
    if: needs.target.outputs.historical != 'true'
    uses: ./.github/workflows/ci.yaml
    with:
      include-images: false

  publish:
    name: Publish selected component image
    needs: [target, checks]
    if: needs.target.outputs.publish_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up QEMU for Management
        if: needs.target.outputs.component == 'cf-mgmt'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ needs.target.outputs.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.target.outputs.image }}:${{ needs.target.outputs.image_tag }}
          build-args: |
            CFN_UI_API_BASE_URL=${{ vars.CFN_UI_API_BASE_URL || 'http://localhost:9000' }}
          cache-from: type=gha,scope=${{ needs.target.outputs.component }}
          cache-to: type=gha,mode=max,scope=${{ needs.target.outputs.component }}
          provenance: false

  api:
    name: API module tag validated
    needs: [target, checks]
    if: needs.target.outputs.component == 'api'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The api/ module is released by this validated Git tag; no image is published.'
