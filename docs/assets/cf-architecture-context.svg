<g id="cognition-engines" data-center-x="870.0" data-center-y="937.0" transform="translate(870.0 937.0) scale(1.5) translate(-870.0 -937.0)"><rect class="component ce-card" x="700" y="900" width="340" height="74" rx="8"/>
<text x="870.0" y="943" class="ce-text">Cognition Engines</text>
</g>
</svg>
